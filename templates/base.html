<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Social Media Trend Analysis Dashboard{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --bg-color: #0b1120;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #3b82f6 100%);
            --success-gradient: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            --danger-gradient: linear-gradient(135deg, #fb7185 0%, #ef4444 100%);
            --warning-gradient: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            --info-gradient: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.05), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .main-header, .navbar-brand {
            font-family: 'Outfit', sans-serif;
        }

        .navbar {
            background: rgba(11, 17, 32, 0.8) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 1rem 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text-secondary) !important;
            transition: all 0.3s ease;
            border-radius: 0.5rem;
            margin: 0 0.5rem;
            padding: 0.5rem 1rem !important;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--text-primary) !important;
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .main-header {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            animation: fadeInDown 0.8s ease-out;
        }

        .sub-header {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        /* Glassmorphism Cards */
        .metric-card, .search-container, .chart-container, .tweet-container, .table-responsive {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 1.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 0.8s ease-out;
        }

        .metric-card {
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 140px;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            border-radius: 1.5rem 0 0 1.5rem;
        }

        .metric-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.2);
        }

        .metric-card.primary::before { background: var(--primary-gradient); }
        .metric-card.success::before { background: var(--success-gradient); }
        .metric-card.danger::before { background: var(--danger-gradient); }
        .metric-card.warning::before { background: var(--warning-gradient); }

        .metric-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.25rem;
            color: white;
        }

        .metric-label {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-container {
            padding: 3rem 2rem;
        }

        .chart-container {
            padding: 2rem;
            height: 100%;
        }

        /* Inputs & Buttons */
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
            color: white;
        }
        
        .form-control::placeholder {
            color: #64748b;
        }

        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 0.75rem 2.5rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
        }

        .insight-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-left: 4px solid #818cf8;
            color: white;
            padding: 1.5rem;
            border-radius: 1rem;
            font-size: 1.1rem;
        }

        .tweet-container {
            padding: 1.2rem;
            margin: 0.8rem 0;
            background: rgba(15, 23, 42, 0.5);
            border-left: 4px solid #34d399;
            color: #cbd5e1;
        }

        .tweet-container.negative {
            border-left-color: #fb7185;
        }

        .section-title {
            font-family: 'Outfit', sans-serif;
            color: white;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 1.5rem;
        }

        .loading h4 { color: white; }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        /* Tables */
        .table {
            color: var(--text-primary);
        }
        
        .table-dark {
            background-color: transparent;
        }
        
        .table-dark th {
            background-color: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            font-weight: 600;
        }
        
        .table-striped>tbody>tr:nth-of-type(odd)>* {
            color: var(--text-primary);
            background-color: rgba(255,255,255,0.02);
        }
        
        .table-striped>tbody>tr:hover>* {
            color: white;
            background-color: rgba(255,255,255,0.05);
        }
        
        .table td {
            border-color: rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        /* Keyword Tags */
        .keyword-tag {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            outline: none;
        }

        .keyword-tag:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3);
        }
        
        /* Outline buttons */
        .btn-outline-primary { color: #38bdf8; border-color: #38bdf8; }
        .btn-outline-primary:hover { background: #38bdf8; color: #0b1120; }
        
        .btn-outline-success { color: #34d399; border-color: #34d399; }
        .btn-outline-success:hover { background: #34d399; color: #0b1120; }
        
        .btn-outline-info { color: #818cf8; border-color: #818cf8; }
        .btn-outline-info:hover { background: #818cf8; color: #0b1120; }
        
        .btn-outline-warning { color: #fbbf24; border-color: #fbbf24; }
        .btn-outline-warning:hover { background: #fbbf24; color: #0b1120; }
        
        .btn-outline-danger { color: #fb7185; border-color: #fb7185; }
        .btn-outline-danger:hover { background: #fb7185; color: #0b1120; }

        .footer {
            background: rgba(11, 17, 32, 0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 2rem 0;
            color: var(--text-secondary);
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Progress bars */
        .progress {
            background-color: rgba(255,255,255,0.1);
            border-radius: 1rem;
            height: 1rem;
        }
        
        .progress-bar.bg-success { background: var(--success-gradient) !important; }
        .progress-bar.bg-danger { background: var(--danger-gradient) !important; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-chart-line me-2"></i>
                Analytics Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="/">
                            <i class="fas fa-home me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dataset' %}active{% endif %}" href="/dataset">
                            <i class="fas fa-database me-1"></i> Dataset
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'search' %}active{% endif %}" href="/search">
                            <i class="fas fa-search me-1"></i> Search Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'comparison' %}active{% endif %}" href="/comparison">
                            <i class="fas fa-balance-scale me-1"></i> Comparison
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'insights' %}active{% endif %}" href="/insights">
                            <i class="fas fa-lightbulb me-1"></i> Insights
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p class="mb-0">
                <i class="fas fa-chart-line me-2"></i>
                Social Media Trend Analysis Dashboard
                <span class="ms-3">
                    <i class="fas fa-code me-1"></i>
                    Built with Flask & ML
                </span>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
